name: Development Test For Invoice-Pay

on:
  push:
    branches: ['main', dev]
  pull_request:
    branches: ['main', dev]

concurrency: 
  group: 
    ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout Code
        uses: actions/checkout@4

      - name: Setup Node.jobs
        uses: actions/setup-node@4

      - name: Install dependencies
        run: npm ci 
        working-directory: /invoicepay-api  

      - name: Run lint
        run: npm run lint
        working-directory: /invoicepay-api
      
      - name: Build Application
        run: npm run build
        working-directory: /invoicepay-api
      