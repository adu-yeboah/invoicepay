name: Development Test

on:
  push:
    branches: ['main', dev]

  pull_request:
    branches: ['main', dev]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

  steps:
    - name:  Checkout Code
      uses: actions/checkout@4

    - name: Setup Node.jobs
      uses: actions/setup-node@4

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint
    
    - name: Build Application
      run: npm run build
      

